schema_version: "1.0"
rules:
  - id: cybersecurity-dfars-252-204-7012
    title: Covered defense information safeguarding
    severity: high
    applies_when:
      metadata:
        agency_department:
          equals: DoD
        instrument_type:
          in: [solicitation, contract]
    except_when:
      metadata:
        acquisition_solely_cots:
          equals: true
    required_clauses: ["252.204-7012"]
    authority:
      locator: 204.7304(c)
      rationale: DoD solicitations and contracts except acquisitions solely for COTS items.
    citations:
      - "dfars:dfars:204-7304-c:5343579076a3"
      - "dfars:dfars:252-204-7012:67cc8cf25a2b"
  - id: sam-registration-far-52-204-7
    title: System for Award Management registration
    severity: medium
    applies_when:
      contract_contains_any: ["solicitation", "offeror", "award"]
    required_clauses: ["52.204-7"]
    citations: ["far:far:52-204-7:8e198e7e9db4"]
  - id: malformed-clause-reference
    title: Malformed acquisition clause reference
    severity: medium
    detect_regex: '(?i)\b(?:DFARS|FAR)\s+\d{2,3}[.-]\d{3}[.-]\d{3,4}[A-Z]?\b'
    expected_regex: '\b(?:52\.\d{3}-\d+|252\.\d{3}-\d{4})\b'
    citations: []
