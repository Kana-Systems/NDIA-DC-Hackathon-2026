[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "government-contract-review-demo"
version = "0.2.0"
description = "Traceable FastAPI and Gradio government contract review demo"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.35,<2",
    "fastapi>=0.115,<1",
    "fonttools>=4.59,<5",
    "gradio>=5.49,<6",
    "opensearch-py>=2.7,<3",
    "pydantic-settings>=2.6,<3",
    "PyJWT[crypto]>=2.10,<3",
    "pypdf>=5,<7",
    "python-docx>=1.1,<2",
    "python-multipart>=0.0.18,<1",
    "PyYAML>=6,<7",
    "requests>=2.32,<3",
    "scikit-learn>=1.6,<2",
    "uvicorn[standard]>=0.32,<1",
]

[project.urls]
Homepage = "https://github.com/Kana-Systems/NDIA-DC-Hackathon-2026"
Repository = "https://github.com/Kana-Systems/NDIA-DC-Hackathon-2026"

[project.optional-dependencies]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.3,<9",
    "pytest-cov>=6,<8",
    "ruff>=0.8,<1",
]

[tool.setuptools.packages.find]
include = ["app*", "evaluation*", "ingestion*", "knowledge*", "ml*"]

[tool.setuptools.package-data]
knowledge = ["**/*.json", "**/*.jsonl", "**/*.yaml"]
ml = ["**/*.json", "**/*.md", "**/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --disable-warnings --strict-markers"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
