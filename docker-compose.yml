services:
  contract-review:
    build: .
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      WORKSPACE_USERNAME: "${WORKSPACE_USERNAME:-judge}"
      WORKSPACE_PASSWORD: "${WORKSPACE_PASSWORD:?WORKSPACE_PASSWORD is required}"
      MAX_UPLOAD_MB: "${MAX_UPLOAD_MB:-15}"
      BEDROCK_ENABLED: "${BEDROCK_ENABLED:-false}"
      BEDROCK_MODEL_ID: "${BEDROCK_MODEL_ID:-openai.gpt-5.6-terra}"
      AWS_REGION: "${AWS_REGION:-us-gov-west-1}"
      CLASSIFIER_ENABLED: "${CLASSIFIER_ENABLED:-true}"
      OPENSEARCH_ENDPOINT: "${OPENSEARCH_ENDPOINT:-}"
      OPENSEARCH_VECTOR_ENABLED: "${OPENSEARCH_VECTOR_ENABLED:-false}"
      SECURITY_DOMAIN: "${SECURITY_DOMAIN:-demo}"
      IDENTITY_MODE: "${IDENTITY_MODE:-demo}"
      DEMO_IDENTITY_ENABLED: "${DEMO_IDENTITY_ENABLED:-true}"
      DEMO_JWT_SECRET: "${DEMO_JWT_SECRET:?DEMO_JWT_SECRET is required}"
      WORKSPACE_DB_PATH: /srv/app/artifacts/workspace/lens.sqlite
    volumes:
      - lens-workspace:/srv/app/artifacts/workspace
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8080/health', timeout=2)"
      interval: 15s
      timeout: 3s
      retries: 5

  sample-review:
    image: curlimages/curl:8.12.1@sha256:94e9e444bcba979c2ea12e27ae39bee4cd10bc7041a472c4727a558e213744e6
    profiles: ["sample"]
    environment:
      WORKSPACE_USERNAME: "${WORKSPACE_USERNAME:-judge}"
      WORKSPACE_PASSWORD: "${WORKSPACE_PASSWORD:?WORKSPACE_PASSWORD is required}"
    depends_on:
      contract-review:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        curl -fsS -X POST
        -u "$${WORKSPACE_USERNAME}:$${WORKSPACE_PASSWORD}"
        http://contract-review:8080/api/v1/reviews/sample

volumes:
  lens-workspace:
