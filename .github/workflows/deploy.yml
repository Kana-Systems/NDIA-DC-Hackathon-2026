name: Test and deploy GovCloud

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: govcloud-demo
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  test:
    name: Test, lint, and validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements*.txt
            pyproject.toml

      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --requirement requirements-dev.txt
          python -m pip check

      - name: Lint Python
        shell: bash
        run: |
          set -euo pipefail
          paths=()
          for path in app evaluation ingestion knowledge ml tests; do
            [[ -d "$path" ]] && paths+=("$path")
          done
          ruff check docker-entrypoint.py "${paths[@]}"

      - name: Run tests
        shell: bash
        run: |
          set -euo pipefail
          if [[ -d tests ]]; then python -m pytest -q; fi

      - name: Run deterministic intelligence evaluation
        shell: bash
        run: python -m evaluation.intelligence_benchmark

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22.12.0"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Validate React frontend
        working-directory: frontend
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          npm run lint
          npm test
          npm run build

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Validate Terraform
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Report deployment disposition
        shell: bash
        env:
          RUN_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$RUN_REF" == "refs/heads/main" ]]; then
            echo "::notice::Code validation passed; the environment-gated deployment is eligible to run."
          else
            echo "::notice::Code validation passed for $RUN_REF; deployment is skipped because only main may deploy."
          fi

  deploy:
    name: Build, deploy, and smoke test
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: govcloud-demo
    env:
      AWS_REGION: ${{ secrets.AWS_GOV_REGION }}
      AWS_GOV_ROLE_ARN: ${{ secrets.AWS_GOV_ROLE_ARN }}
      TF_STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
      TF_STATE_KEY: ${{ secrets.TF_STATE_KEY }}
      TF_VAR_aws_region: ${{ secrets.AWS_GOV_REGION }}
      TF_VAR_environment: demo
      TF_VAR_security_domain: ${{ secrets.SECURITY_DOMAIN || 'demo' }}
      TF_VAR_create_graph_connector_secret: ${{ secrets.CREATE_GRAPH_CONNECTOR_SECRET || 'false' }}
      TF_VAR_lens_graph_secret_arn: ${{ secrets.LENS_GRAPH_SECRET_ARN || '' }}
      TF_VAR_classifier_endpoint_name: ${{ secrets.CLASSIFIER_ENDPOINT_NAME || '' }}
      TF_VAR_classifier_model_data_url: ${{ secrets.CLASSIFIER_MODEL_DATA_URL || '' }}
      TF_VAR_domain_name: ${{ secrets.APP_DOMAIN }}
      TF_VAR_allowed_ingress_cidrs: ${{ secrets.ALLOWED_INGRESS_CIDRS_JSON }}
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          lfs: true

      - name: Validate deployment inputs
        shell: bash
        run: |
          set -euo pipefail
          [[ "$AWS_REGION" =~ ^us-gov- ]]
          [[ "$AWS_GOV_ROLE_ARN" =~ ^arn:aws-us-gov:iam::[0-9]{12}:role/ ]]
          [[ "$TF_STATE_BUCKET" =~ ^[a-z0-9][a-z0-9.-]{1,61}[a-z0-9]$ ]]
          [[ "$TF_STATE_KEY" =~ ^[A-Za-z0-9._/-]+$ ]]
          [[ "$TF_STATE_KEY" =~ /demo\.tfstate$ ]]
          [[ "$TF_VAR_environment" == "demo" ]]
          [[ "$TF_VAR_security_domain" =~ ^[a-z][a-z0-9-]{1,15}$ ]]
          [[ "$TF_VAR_create_graph_connector_secret" =~ ^(true|false)$ ]]
          [[ -z "$TF_VAR_classifier_endpoint_name" || "$TF_VAR_classifier_endpoint_name" =~ ^[A-Za-z0-9](-*[A-Za-z0-9]){0,62}$ ]]
          [[ -z "$TF_VAR_classifier_model_data_url" || "$TF_VAR_classifier_model_data_url" =~ ^s3://contract-review-demo-training-[0-9]{12}/inference/llama-cuad-r128-ensemble-[0-9a-f]{64}\.tar\.gz$ ]]
          [[ "$TF_VAR_domain_name" =~ ^[a-z0-9.-]+\.[a-z]{2,}$ ]]
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' \
            <<<"$TF_VAR_allowed_ingress_cidrs" >/dev/null

      - name: Reclaim disk for classifier image
        if: env.TF_VAR_classifier_model_data_url != ''
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf \
            /opt/ghc \
            /opt/hostedtoolcache/CodeQL \
            /usr/local/.ghcup \
            /usr/local/lib/android \
            /usr/local/share/boost \
            /usr/share/dotnet
          docker system prune --all --force
          available_kib="$(df --output=avail -k / | awk 'NR == 2 { print $1 }')"
          [[ "$available_kib" =~ ^[0-9]+$ ]]
          (( available_kib >= 28 * 1024 * 1024 ))
          df -h /

      - name: Configure GovCloud credentials
        uses: aws-actions/configure-aws-credentials@cbe3b392738ccf3f987d68400dafcf4b0624a56c # v6.2.4
        with:
          aws-region: ${{ secrets.AWS_GOV_REGION }}
          role-to-assume: ${{ secrets.AWS_GOV_ROLE_ARN }}
          role-session-name: github-deploy-${{ github.run_id }}
          audience: sts.amazonaws.com

      - name: Verify pinned classifier artifact
        if: env.TF_VAR_classifier_model_data_url != ''
        shell: bash
        run: |
          set -euo pipefail
          manifest="ml/deployment/llama_r128_ensemble_artifact.json"
          thresholds="ml/deployment/llama_r128_ensemble_thresholds.json"
          jq -e --arg model_id "$(jq -r '.model_id' "$thresholds")" \
            '.schema_version == "1.0" and .model_id == $model_id' \
            "$manifest" >/dev/null
          expected_uri="$(jq -r '.s3_uri' "$manifest")"
          [[ "$TF_VAR_classifier_model_data_url" == "$expected_uri" ]]
          object="${expected_uri#s3://}"
          bucket="${object%%/*}"
          key="${object#*/}"
          account="$(aws sts get-caller-identity --query Account --output text)"
          [[ "$bucket" == "contract-review-demo-training-${account}" ]]
          head="$(aws s3api head-object \
            --region "$AWS_REGION" \
            --bucket "$bucket" \
            --key "$key" \
            --expected-bucket-owner "$account")"
          jq -e \
            --arg version "$(jq -r '.s3_version_id' "$manifest")" \
            --arg sha256 "$(jq -r '.archive_sha256' "$manifest")" \
            --arg model_id "$(jq -r '.model_id' "$manifest")" \
            --arg content_type "$(jq -r '.content_type' "$manifest")" \
            --arg encryption "$(jq -r '.server_side_encryption' "$manifest")" \
            --arg kms_key "$(jq -r '.sse_kms_key_id' "$manifest")" \
            --argjson bytes "$(jq -r '.archive_bytes' "$manifest")" \
            '
              .VersionId == $version
              and .ContentLength == $bytes
              and .ContentType == $content_type
              and .ServerSideEncryption == $encryption
              and .SSEKMSKeyId == $kms_key
              and .Metadata.sha256 == $sha256
              and .Metadata["model-id"] == $model_id
            ' <<<"$head" >/dev/null

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Initialize Terraform and ensure ECR
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform init \
            -backend-config="bucket=${TF_STATE_BUCKET}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="region=${AWS_REGION}" \
            -backend-config="use_lockfile=true"
          terraform apply -auto-approve -target=aws_ecr_repository.app
          repository_url="$(terraform output -raw ecr_repository_url)"
          [[ "$repository_url" =~ ^[0-9]{12}\.dkr\.ecr\.us-gov-[a-z]+-[0-9]\.amazonaws\.com/ ]]
          echo "REPOSITORY_URL=$repository_url" >> "$GITHUB_ENV"
          echo "IMAGE_TAG=${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1

      - name: Sign in to ECR
        shell: bash
        run: |
          set -euo pipefail
          registry="${REPOSITORY_URL%%/*}"
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login --username AWS --password-stdin "$registry"

      - name: Build and push immutable image
        shell: bash
        run: |
          set -euo pipefail
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}-[0-9]+-[0-9]+$ ]]
          python scripts/verify-shared-artifacts.py
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --file Dockerfile \
            --tag "${REPOSITORY_URL}:${IMAGE_TAG}" \
            --push .

      - name: Resolve immutable image digest
        shell: bash
        run: |
          set -euo pipefail
          repository_name="${REPOSITORY_URL##*/}"
          digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$repository_name" \
            --image-ids "imageTag=${IMAGE_TAG}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TF_VAR_image_uri=${REPOSITORY_URL}@${digest}" >> "$GITHUB_ENV"

      - name: Build private classifier inference image
        if: env.TF_VAR_classifier_model_data_url != ''
        shell: bash
        run: |
          set -euo pipefail
          aws ecr get-login-password --region "$AWS_REGION" |
            docker login \
              --username AWS \
              --password-stdin \
              442386744353.dkr.ecr.us-gov-west-1.amazonaws.com
          classifier_tag="${IMAGE_TAG}-classifier"
          docker buildx build \
            --platform linux/amd64 \
            --provenance=true \
            --sbom=true \
            --file Dockerfile.sagemaker \
            --tag "${REPOSITORY_URL}:${classifier_tag}" \
            --push .
          repository_name="${REPOSITORY_URL##*/}"
          digest="$(aws ecr describe-images \
            --region "$AWS_REGION" \
            --repository-name "$repository_name" \
            --image-ids "imageTag=${classifier_tag}" \
            --query 'imageDetails[0].imageDigest' \
            --output text)"
          [[ "$digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "TF_VAR_classifier_inference_image_uri=${REPOSITORY_URL}@${digest}" >> "$GITHUB_ENV"

      - name: Terraform plan
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          terraform plan -out=tfplan

      - name: Terraform apply
        working-directory: infra/terraform
        shell: bash
        run: terraform apply -auto-approve tfplan

      - name: Verify managed classifier endpoint
        if: env.TF_VAR_classifier_model_data_url != ''
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          endpoint="$(terraform output -raw classifier_endpoint_name)"
          [[ "$endpoint" =~ ^[A-Za-z0-9](-*[A-Za-z0-9]){0,62}$ ]]
          request="$(mktemp)"
          response="$(mktemp)"
          trap 'rm -f "$request" "$response"' EXIT
          jq -cn \
            '{texts: ["Either party may terminate this agreement for convenience."], threshold: 0.5}' \
            >"$request"
          aws sagemaker-runtime invoke-endpoint \
            --region "$AWS_REGION" \
            --endpoint-name "$endpoint" \
            --content-type application/json \
            --accept application/json \
            --cli-binary-format raw-in-base64-out \
            --body "fileb://${request}" \
            "$response" >/dev/null
          jq -e '
            (.predictions | length) == 1
            and .predictions[0].model_id == "Llama-3.1-CUAD-r128-ensemble-3seed"
            and (.predictions[0].labels | type) == "array"
          ' "$response" >/dev/null

      - name: Seed sample knowledge in OpenSearch
        if: ${{ false }} # Lens uses the packaged official corpus, not sample knowledge.
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail

          cluster="$(terraform output -raw ecs_cluster_name)"
          task_definition="$(terraform output -raw knowledge_index_task_definition_arn)"
          private_subnets="$(terraform output -json private_subnet_ids)"
          security_group="$(terraform output -raw app_security_group_id)"

          [[ "$task_definition" =~ ^arn:aws-us-gov:ecs: ]]
          [[ "$security_group" =~ ^sg-[0-9a-f]+$ ]]
          jq -e \
            'type == "array" and length > 0 and all(.[]; test("^subnet-[0-9a-f]+$"))' \
            <<<"$private_subnets" >/dev/null

          network_configuration="$(
            jq -cn \
              --argjson subnets "$private_subnets" \
              --arg security_group "$security_group" \
              '{
                awsvpcConfiguration: {
                  subnets: $subnets,
                  securityGroups: [$security_group],
                  assignPublicIp: "DISABLED"
                }
              }'
          )"
          overrides="$(
            jq -cn \
              '{
                containerOverrides: [{
                  name: "knowledge-index",
                  command: [
                    "/bin/sh",
                    "-c",
                    "exec python -m knowledge.index_opensearch knowledge/samples/official_sources.jsonl --endpoint \"$OPENSEARCH_ENDPOINT\" --index \"$OPENSEARCH_INDEX\" --embed"
                  ]
                }]
              }'
          )"

          run_result="$(
            aws ecs run-task \
              --region "$AWS_REGION" \
              --cluster "$cluster" \
              --launch-type FARGATE \
              --platform-version LATEST \
              --task-definition "$task_definition" \
              --network-configuration "$network_configuration" \
              --overrides "$overrides" \
              --started-by "seed-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output json
          )"

          if jq -e '(.failures // []) | length > 0' <<<"$run_result" >/dev/null; then
            jq -r '.failures[] | "ECS run-task failure: \(.arn // "unknown"): \(.reason // "unknown")"' \
              <<<"$run_result" >&2
            exit 1
          fi

          task_arn="$(jq -er '.tasks | select(length == 1) | .[0].taskArn' <<<"$run_result")"
          aws ecs wait tasks-stopped \
            --region "$AWS_REGION" \
            --cluster "$cluster" \
            --tasks "$task_arn"

          task_result="$(
            aws ecs describe-tasks \
              --region "$AWS_REGION" \
              --cluster "$cluster" \
              --tasks "$task_arn" \
              --output json
          )"
          jq -r '
            .tasks[0] as $task
            | ($task.containers[]? | select(.name == "knowledge-index")) as $container
            | "knowledge seed stopCode=\($task.stopCode // "unknown")"
              + " exitCode=\($container.exitCode // "missing")"
              + " stoppedReason=\($task.stoppedReason // "unknown")"
              + " containerReason=\($container.reason // "none")"
          ' <<<"$task_result"

          task_id="${task_arn##*/}"
          if ! jq -e '
            ((.failures // []) | length == 0)
            and (.tasks | length == 1)
            and any(
              .tasks[0].containers[]?;
              .name == "knowledge-index" and .exitCode == 0
            )
          ' <<<"$task_result" >/dev/null; then
            aws logs get-log-events \
              --region "$AWS_REGION" \
              --log-group-name "/ecs/${cluster}" \
              --log-stream-name "knowledge-index/knowledge-index/${task_id}" \
              --query 'events[].message' \
              --output text >&2 || true
            echo "Knowledge indexing task failed." >&2
            exit 1
          fi

      - name: Ingest deterministic J2 fixture corpus
        if: ${{ false }} # Synthetic fixtures are evaluation-only, never deployment data.
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail

          cluster="$(terraform output -raw ecs_cluster_name)"
          task_definition="$(terraform output -raw fixture_ingestion_task_definition_arn)"
          private_subnets="$(terraform output -json private_subnet_ids)"
          security_group="$(terraform output -raw app_security_group_id)"

          [[ "$task_definition" =~ ^arn:aws-us-gov:ecs: ]]
          [[ "$task_definition" == *:* ]]
          [[ "$security_group" =~ ^sg-[0-9a-f]+$ ]]
          task_image="$(
            aws ecs describe-task-definition \
              --region "$AWS_REGION" \
              --task-definition "$task_definition" \
              --query 'taskDefinition.containerDefinitions[?name==`fixture-ingestion`].image | [0]' \
              --output text
          )"
          [[ "$task_image" == "$TF_VAR_image_uri" ]]
          [[ "$task_image" =~ @sha256:[0-9a-f]{64}$ ]]
          jq -e \
            'type == "array" and length > 0 and all(.[]; test("^subnet-[0-9a-f]+$"))' \
            <<<"$private_subnets" >/dev/null

          network_configuration="$(
            jq -cn \
              --argjson subnets "$private_subnets" \
              --arg security_group "$security_group" \
              '{
                awsvpcConfiguration: {
                  subnets: $subnets,
                  securityGroups: [$security_group],
                  assignPublicIp: "DISABLED"
                }
              }'
          )"
          overrides="$(
            jq -cn \
              '{
                containerOverrides: [{
                  name: "fixture-ingestion",
                  command: ["python", "-m", "ingestion.cli", "--count", "120", "--durable"]
                }]
              }'
          )"

          run_result="$(
            aws ecs run-task \
              --region "$AWS_REGION" \
              --cluster "$cluster" \
              --launch-type FARGATE \
              --platform-version LATEST \
              --task-definition "$task_definition" \
              --network-configuration "$network_configuration" \
              --overrides "$overrides" \
              --started-by "fixture-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --output json
          )"

          if jq -e '(.failures // []) | length > 0' <<<"$run_result" >/dev/null; then
            jq -r '.failures[] | "ECS run-task failure: \(.arn // "unknown"): \(.reason // "unknown")"' \
              <<<"$run_result" >&2
            exit 1
          fi

          task_arn="$(jq -er '.tasks | select(length == 1) | .[0].taskArn' <<<"$run_result")"
          aws ecs wait tasks-stopped \
            --region "$AWS_REGION" \
            --cluster "$cluster" \
            --tasks "$task_arn"

          task_result="$(
            aws ecs describe-tasks \
              --region "$AWS_REGION" \
              --cluster "$cluster" \
              --tasks "$task_arn" \
              --output json
          )"
          jq -r '
            .tasks[0] as $task
            | ($task.containers[]? | select(.name == "fixture-ingestion")) as $container
            | "fixture ingestion stopCode=\($task.stopCode // "unknown")"
              + " exitCode=\($container.exitCode // "missing")"
              + " stoppedReason=\($task.stoppedReason // "unknown")"
              + " containerReason=\($container.reason // "none")"
          ' <<<"$task_result"

          task_id="${task_arn##*/}"
          log_group="/ecs/${cluster}"
          log_stream="fixture-ingestion/fixture-ingestion/${task_id}"
          if ! jq -e '
            ((.failures // []) | length == 0)
            and (.tasks | length == 1)
            and any(
              .tasks[0].containers[]?;
              .name == "fixture-ingestion" and .exitCode == 0
            )
          ' <<<"$task_result" >/dev/null; then
            aws logs get-log-events \
              --region "$AWS_REGION" \
              --log-group-name "$log_group" \
              --log-stream-name "$log_stream" \
              --query 'events[].message' \
              --output text >&2 || true
            echo "Fixture ingestion task failed." >&2
            exit 1
          fi

          summary=""
          for _ in {1..10}; do
            messages="$(
              aws logs get-log-events \
                --region "$AWS_REGION" \
                --log-group-name "$log_group" \
                --log-stream-name "$log_stream" \
                --query 'events[].message' \
                --output json
            )"
            summary="$(
              jq -cer \
                '[.[] | fromjson? | select(.durable? == true and (.documents_generated? // 0) >= 120 and (.documents_ingested? // 0) >= 120 and (.records_stored? // 0) >= 120)] | last // empty' \
                <<<"$messages"
            )" || true
            [[ -n "$summary" ]] && break
            sleep 3
          done

          if [[ -z "$summary" ]]; then
            echo "Fixture task succeeded but did not emit a >=120-document summary." >&2
            exit 1
          fi
          jq -r '"Verified durable fixture ingestion: generated=\(.documents_generated) ingested=\(.documents_ingested) records=\(.records_stored)"' \
            <<<"$summary"

      - name: Force service deployment
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          cluster="$(terraform output -raw ecs_cluster_name)"
          service="$(terraform output -raw ecs_service_name)"
          aws ecs update-service \
            --cluster "$cluster" \
            --service "$service" \
            --force-new-deployment >/dev/null
          aws ecs wait services-stable --cluster "$cluster" --services "$service"

      - name: Verify load balancer target health
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          target_group="$(terraform output -raw target_group_arn)"
          for _ in {1..20}; do
            target_health="$(
              aws elbv2 describe-target-health \
                --target-group-arn "$target_group" \
                --output json
            )"
            if jq -e '
              (.TargetHealthDescriptions | length) > 0
              and all(.TargetHealthDescriptions[]; .TargetHealth.State == "healthy")
            ' <<<"$target_health" >/dev/null; then
              exit 0
            fi
            sleep 15
          done
          echo "ALB targets did not become healthy: $target_group" >&2
          exit 1

      - name: Report external DNS record
        working-directory: infra/terraform
        shell: bash
        run: |
          set -euo pipefail
          cname_name="$(terraform output -raw external_dns_cname_name)"
          cname_target="$(terraform output -raw external_dns_cname_target)"
          echo "::notice title=Squarespace application CNAME::Name=${cname_name} Target=${cname_target}"
